<!doctype html>
<html lang="es" data-tema="oscuro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0a0c0f">
  <!-- App instalable (PWA) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="assets/iconos/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/iconos/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Futbol Cards">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Futbol Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
  <script>
    // Aplica el tema guardado antes de pintar (evita parpadeo).
    try { const t = localStorage.getItem('fc-tema'); if (t) document.documentElement.dataset.tema = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="cabecera">
    <button class="boton-icono" id="volver" aria-label="Volver al inicio" title="Volver al inicio">←</button>
    <button class="marca" id="marca" aria-label="Ir al inicio">Futbol <span>Cards</span></button>
    <span class="titulo-pantalla" id="titulo"></span>
    <button class="boton-instalar" id="instalar" hidden title="Instalar Futbol Cards como app">⬇ Instalar</button>
    <div class="control-sonido">
      <button class="boton-icono" id="sonido" aria-label="Música: volumen y silencio" aria-haspopup="true" aria-expanded="false" title="Música">🔊</button>
      <div class="panel-sonido" id="panel-sonido" hidden>
        <div class="pista-actual" id="pista">♪</div>
        <div class="fila-volumen">
          <button class="boton-icono" id="silencio" aria-label="Silenciar o activar la música">🔊</button>
          <input type="range" id="volumen" min="0" max="100" step="1" aria-label="Volumen de la música">
          <span id="volumen-valor" class="volumen-valor">50</span>
        </div>
      </div>
    </div>
    <button class="boton-icono" id="tema" aria-label="Cambiar entre modo oscuro y claro" title="Modo oscuro / claro">☀️</button>
  </header>
  <main id="app"></main>
  <script type="module" src="js/ui/app.js"></script>
</body>
</html>
